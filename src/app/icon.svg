<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Microbe Body Radial Gradient -->
    <radialGradient id="microbeBody" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="85%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>

    <!-- Sprout Leaf Gradient -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="70%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#A3E635" />
    </linearGradient>

    <!-- Amber Nucleus Radial Gradient -->
    <radialGradient id="nucleusGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </radialGradient>

    <!-- Soft Drop Shadow -->
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Sprout Leaves (Growing at top) -->
  <g filter="url(#clayShadow)">
    <!-- Stem -->
    <path d="M 32 18 Q 33 11 38 7" fill="none" stroke="#4ADE80" stroke-width="3" stroke-linecap="round" />
    <!-- Left Leaf -->
    <path d="M 34 14 C 28 10 24 12 22 15 C 24 18 30 17 34 14 Z" fill="url(#sproutGrad)" />
    <!-- Right Leaf -->
    <path d="M 38 9 C 43 5 48 6 50 10 C 47 13 42 12 38 9 Z" fill="url(#sproutGrad)" />
  </g>

  <!-- Microbe Membrane Cilia / Outer Bumps -->
  <g fill="#10B981" opacity="0.9">
    <circle cx="15" cy="38" r="4.5" />
    <circle cx="19" cy="27" r="4.5" />
    <circle cx="28" cy="20" r="4" />
    <circle cx="44" cy="22" r="4.5" />
    <circle cx="51" cy="31" r="4" />
    <circle cx="51" cy="43" r="4.5" />
    <circle cx="43" cy="52" r="4.5" />
    <circle cx="31" cy="55" r="4" />
    <circle cx="19" cy="50" r="4" />
  </g>

  <!-- Main Microbe Body -->
  <circle cx="33" cy="37" r="18.5" fill="url(#microbeBody)" filter="url(#clayShadow)" />

  <!-- Glossy Clay Specular Highlight -->
  <ellipse cx="27" cy="27" rx="6" rx2="3" ry="3" fill="#FFFFFF" opacity="0.45" transform="rotate(-30 27 27)" />

  <!-- Amber Core Organelle / Nucleus -->
  <circle cx="39" cy="43" r="4.5" fill="url(#nucleusGrad)" />
  <circle cx="25" cy="43" r="2.8" fill="#38BDF8" opacity="0.85" />

  <!-- Determined / Friendly Eyes -->
  <!-- Left Eye -->
  <ellipse cx="27" cy="34" rx="3.4" ry="4" fill="#FFFFFF" />
  <ellipse cx="27.5" cy="34.5" rx="2.1" ry="2.6" fill="#0F172A" />
  <circle cx="26.5" cy="33" r="0.9" fill="#FFFFFF" />

  <!-- Right Eye -->
  <ellipse cx="38" cy="34" rx="3.4" ry="4" fill="#FFFFFF" />
  <ellipse cx="38.5" cy="34.5" rx="2.1" ry="2.6" fill="#0F172A" />
  <circle cx="37.5" cy="33" r="0.9" fill="#FFFFFF" />

  <!-- Rosy Cheeks -->
  <ellipse cx="22.5" cy="38" rx="2" ry="1.2" fill="#F472B6" opacity="0.6" />
  <ellipse cx="42.5" cy="38" rx="2" ry="1.2" fill="#F472B6" opacity="0.6" />

  <!-- Smile -->
  <path d="M 30 39 Q 33 42 36 39" fill="none" stroke="#0F172A" stroke-width="1.3" stroke-linecap="round" />
</svg>
